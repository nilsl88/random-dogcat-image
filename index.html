<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Dog and Cat Pictures</title>
    <style>
        :root {
            color-scheme: light;
            --page-background: #f4f4f4;
            --page-text: #111;
            --status-text: #333;
            --error-text: #b00020;
            --theme-button-background: #111;
            --theme-button-text: #fff;
            --theme-button-hover: #333;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --page-background: #151515;
                --page-text: #f4f4f4;
                --status-text: #d6d6d6;
                --error-text: #ff8a8a;
                --theme-button-background: #f4f4f4;
                --theme-button-text: #111;
                --theme-button-hover: #d9d9d9;
            }
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --page-background: #f4f4f4;
            --page-text: #111;
            --status-text: #333;
            --error-text: #b00020;
            --theme-button-background: #111;
            --theme-button-text: #fff;
            --theme-button-hover: #333;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-background: #151515;
            --page-text: #f4f4f4;
            --status-text: #d6d6d6;
            --error-text: #ff8a8a;
            --theme-button-background: #f4f4f4;
            --theme-button-text: #111;
            --theme-button-hover: #d9d9d9;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--page-background);
            color: var(--page-text);
            font-family: Arial, sans-serif;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 20px;
        }
        #status {
            min-height: 1.5em;
            margin: 0 0 10px;
            color: var(--status-text);
        }
        #status.error {
            color: var(--error-text);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #008CBA;
            color: white;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background-color: #005f73;
        }
        #theme-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1;
            margin: 0;
            padding: 6px 10px;
            border: 1px solid var(--theme-button-background);
            background-color: var(--theme-button-background);
            color: var(--theme-button-text);
            font-size: 13px;
            line-height: 1;
        }
        #theme-toggle:hover {
            background-color: var(--theme-button-hover);
        }
        #theme-toggle:focus-visible {
            outline: 2px solid #008CBA;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark</button>
    <h1 id="server-name">Loading server name...</h1>
    <h2>Random Dog and Cat Pictures from the internet</h2>
    <img id="animal" src="" alt="Random animal picture" aria-busy="false">
    <p id="status" role="status" aria-live="polite"></p>
    <button onclick="fetchRandomAnimal()">Get Random Dog or Cat</button>
    <button onclick="fetchDog()">Get Random Dog</button>
    <button onclick="fetchCat()">Get Random Cat</button>

    <script>
        document.getElementById('server-name').innerText = `Server: $REPLACE`;

        const page = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
        let themeWasSelected = false;

        function applyTheme(theme) {
            const darkMode = theme === 'dark';
            const nextTheme = darkMode ? 'light' : 'dark';

            page.dataset.theme = theme;
            themeToggle.textContent = darkMode ? 'Light' : 'Dark';
            themeToggle.setAttribute('aria-label', `Switch to ${nextTheme} mode`);
            themeToggle.title = `Switch to ${nextTheme} mode`;
        }

        function applySystemTheme(event) {
            if (!themeWasSelected) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        }

        themeToggle.addEventListener('click', () => {
            themeWasSelected = true;
            applyTheme(page.dataset.theme === 'dark' ? 'light' : 'dark');
        });
        systemTheme.addEventListener('change', applySystemTheme);
        applySystemTheme(systemTheme);

        const animalImage = document.getElementById('animal');
        const statusMessage = document.getElementById('status');
        const imageSources = {
            dog: {
                endpoint: 'https://dog.ceo/api/breeds/image/random',
                getUrl: data => data?.message
            },
            cat: {
                endpoint: 'https://api.thecatapi.com/v1/images/search?limit=1&order=RANDOM',
                getUrl: data => data?.[0]?.url
            }
        };

        let activeController;
        let latestRequestId = 0;

        function setStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.classList.toggle('error', isError);
        }

        function validateImageUrl(value) {
            if (typeof value !== 'string' || value.length === 0) {
                throw new Error('The image API returned no image URL.');
            }

            const url = new URL(value);
            if (url.protocol !== 'https:' && url.protocol !== 'http:') {
                throw new Error('The image API returned an invalid image URL.');
            }

            return url.href;
        }

        async function fetchImageUrl(animal, signal) {
            const source = imageSources[animal];
            const response = await fetch(source.endpoint, {
                cache: 'no-store',
                signal
            });

            if (!response.ok) {
                throw new Error(`${animal} API returned HTTP ${response.status}.`);
            }

            const data = await response.json();
            return validateImageUrl(source.getUrl(data));
        }

        function preloadImage(url, signal) {
            return new Promise((resolve, reject) => {
                const image = new Image();

                const cleanup = () => {
                    image.onload = null;
                    image.onerror = null;
                    signal.removeEventListener('abort', handleAbort);
                };

                const handleAbort = () => {
                    cleanup();
                    image.src = '';
                    reject(new DOMException('Image request cancelled.', 'AbortError'));
                };

                image.onload = () => {
                    cleanup();
                    resolve();
                };
                image.onerror = () => {
                    cleanup();
                    reject(new Error('The image file could not be loaded.'));
                };
                signal.addEventListener('abort', handleAbort, { once: true });

                if (signal.aborted) {
                    handleAbort();
                    return;
                }

                image.src = url;
            });
        }

        async function loadAnimal(animal) {
            const requestId = ++latestRequestId;
            activeController?.abort();

            const controller = new AbortController();
            activeController = controller;
            animalImage.setAttribute('aria-busy', 'true');
            setStatus(`Loading a random ${animal}...`);

            try {
                const imageUrl = await fetchImageUrl(animal, controller.signal);
                await preloadImage(imageUrl, controller.signal);

                if (requestId !== latestRequestId) {
                    return;
                }

                animalImage.src = imageUrl;
                animalImage.alt = `Random ${animal} picture`;
                setStatus(`Showing a random ${animal}.`);
            } catch (error) {
                if (requestId !== latestRequestId || error.name === 'AbortError') {
                    return;
                }

                console.error(`Failed to load a random ${animal}:`, error);
                setStatus(`Could not load a random ${animal}. Try again.`, true);
            } finally {
                if (requestId === latestRequestId) {
                    animalImage.setAttribute('aria-busy', 'false');
                    activeController = null;
                }
            }
        }

        function fetchDog() {
            return loadAnimal('dog');
        }

        function fetchCat() {
            return loadAnimal('cat');
        }

        function fetchRandomAnimal() {
            const animal = Math.random() < 0.5 ? 'dog' : 'cat';
            return loadAnimal(animal);
        }

        fetchDog();
    </script>
</body>
</html>
