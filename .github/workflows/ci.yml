name: Build and Publish Container Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the smoke test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: random-dogcat:smoke
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: bash scripts/smoke-test.sh random-dogcat:smoke

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build both architectures
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: docker.io/lundberg88/random-dogcat:latest
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published architectures
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw \
            "docker.io/lundberg88/random-dogcat@${IMAGE_DIGEST}" > manifest.json
          jq --exit-status '
            [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
            | contains(["amd64", "arm64"])
          ' manifest.json
